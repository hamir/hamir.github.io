<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran Meaning Groups</title>
<style>
  :root {
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f5; --line:#d8dee4;
    --txt:#1f2328; --muted:#656d76; --accent:#0969da;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .ar { font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif; direction:rtl; unicode-bidi:isolate; }
  header {
    position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line); padding:14px 20px;
  }
  h1 { margin:0 0 10px; font-size:19px; font-weight:600; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select {
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:14px;
  }
  input#q { flex:1; min-width:200px; }
  .stats { color:var(--muted); font-size:13px; margin-left:auto; }
  main { padding:16px 20px 60px; max-width:1000px; margin:0 auto; }
  .root {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden;
  }
  .root-head {
    display:flex; align-items:center; gap:14px; padding:12px 16px; cursor:pointer;
    user-select:none;
  }
  .root-head:hover { background:var(--panel2); }
  .caret { color:var(--muted); transition:transform .15s; font-size:12px; width:12px; }
  .root.open .caret { transform:rotate(90deg); }
  .root-ar { font-size:26px; font-weight:600; min-width:90px; }
  .root-meta { color:var(--muted); font-size:13px; }
  .root-score { margin-left:auto; text-align:right; }
  .score-num { font-size:18px; font-weight:600; color:var(--accent); }
  .score-lbl { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  table { width:100%; border-collapse:collapse; }
  .lemmas { display:none; border-top:1px solid var(--line); }
  .root.open .lemmas { display:block; }
  th, td { padding:9px 16px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:500; }
  tr:last-child td { border-bottom:none; }
  td.lemma-ar { font-size:20px; font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.score { color:var(--accent); font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
  .pos {
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-weight:600; letter-spacing:.3px;
  }
  .pos.NOUN { background:#ddf4ff; color:#0550ae; }
  .pos.VERB { background:#fff1e5; color:#bc4c00; }
  .pos.ADJECTIVE { background:#faf0ff; color:#8250df; }
  .pos.ADVERB { background:#e6ffec; color:#1a7f37; }
  .pos.PRONOUN { background:#ffeff2; color:#cf222e; }
  .pos.PARTICLE { background:#eaeef2; color:#57606a; }
  .vf {
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:10px;
    font-size:11px; font-weight:600; letter-spacing:.03em;
    background:#fff8c5; color:#7d4e00; border:1px solid #d4a72c66;
  }
  .m-cnt { color:var(--muted); font-size:11px; opacity:.75; margin-left:3px; font-variant-numeric:tabular-nums; }
  .m-x:hover { color:#c0392b; }
  .hidden { display:none; }
  mark { background:#fff3c4; color:inherit; padding:0 1px; border-radius:2px; }
  .meaning-label {
    font-weight:600; font-size:12px; text-transform:uppercase;
    letter-spacing:.6px; color:var(--txt);
  }
  .meaning-desc {
    display:block; color:var(--muted); font-size:12px; font-style:italic;
  }
  tr.lemma-row { cursor:pointer; }
  tr.lemma-row:hover td { background:var(--panel2); }
  tr.frag-row > td { background:var(--bg); padding:6px 16px 14px; }
  .frag {
    display:flex; flex-direction:column; gap:2px; padding:10px 14px; margin-top:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
  }
  .frag-loc { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .frag-combined { color:var(--muted); font-size:11px; border:1px solid var(--line);
    border-radius:8px; padding:0 6px; margin-left:6px; vertical-align:1px; }
  .frag-words { display:flex; flex-wrap:wrap; direction:rtl; gap:4px 4px; margin:4px 0 2px; }
  .frag-words .w {
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:2px 6px; border-radius:6px; max-width:150px;
  }
  .frag-words .w.hit { background:#fff3c4; box-shadow:0 0 0 1px #e8d44d; }
  .frag-words .wa { font-size:21px; line-height:1.7; }
  .frag-words .we { color:var(--muted); font-size:11px; line-height:1.3; direction:ltr; }
  .frag-en { color:var(--muted); font-size:14px; border-top:1px solid var(--line); padding-top:6px; margin-top:4px; }
  .frag-status { color:var(--muted); font-size:13px; padding:10px 4px 2px; }
  .tags { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .tag {
    display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
    background:#e7f3e9; color:#1a7f37; border:1px solid #bfdec5;
    border-radius:20px; font-size:12px; font-weight:600;
  }
  .tag-x { cursor:pointer; color:#5a9b68; font-weight:700; }
  .tag-x:hover { color:#c0392b; }
  .tag-add {
    border:1px dashed var(--line); background:none; color:var(--muted);
    border-radius:20px; padding:2px 9px; font-size:12px; cursor:pointer;
  }
  .tag-add:hover { color:var(--accent); border-color:var(--accent); }
  input.tag-input {
    width:90px; padding:2px 8px; font-size:12px; border-radius:20px;
  }
  .tag-menu { display:inline-flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .tag-pick {
    border:1px solid var(--line); background:var(--panel2); color:var(--txt);
    border-radius:20px; padding:2px 9px; font-size:12px; cursor:pointer;
  }
  .tag-pick:hover { border-color:var(--accent); color:var(--accent); }
  /* ---- header tag bar ---- */
  .tagbar {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin-top:10px; font-size:13px;
  }
  .tagbar .lbl { color:var(--muted); font-size:12px; letter-spacing:.4px; text-transform:uppercase; }
  .fchip {
    display:inline-flex; align-items:center; gap:6px; padding:4px 12px;
    border:1px solid var(--line); border-radius:20px; background:var(--panel);
    cursor:pointer; user-select:none; font-weight:600; font-size:13px;
  }
  .fchip .cnt { color:var(--muted); font-weight:500; font-size:12px; }
  .fchip:hover { border-color:var(--accent); }
  .fchip.only { background:#ddf4ff; border-color:#54aeff; color:#0550ae; }
  .fchip.hide { background:#ffeff2; border-color:#ff818f; color:#cf222e; text-decoration:line-through; }
  .fchip .mode { font-size:11px; font-weight:700; }
  .fchip .fchip-x { color:var(--muted); font-weight:700; padding:0 2px; }
  .fchip .fchip-x:hover { color:#c0392b; }
  .fchip.confirm { background:#cf222e; border-color:#cf222e; color:#fff; }
  .fchip.confirm .cnt, .fchip.confirm .fchip-x { color:#ffd7db; }
  /* ---- mobile ---- */
  @media (max-width: 640px) {
    header { padding:10px 12px; }
    h1 { font-size:17px; margin-bottom:8px; }
    .controls { gap:8px; }
    input, select { font-size:16px; padding:7px 10px; } /* <16px makes iOS zoom on focus */
    input#q { min-width:0; flex:1 1 100%; }
    .stats { font-size:12px; }
    main { padding:12px 8px 60px; }
    .root-head { flex-wrap:wrap; gap:6px 10px; padding:10px 12px; }
    .root-ar { font-size:22px; min-width:0; }
    .root-score { text-align:left; display:flex; align-items:baseline; gap:4px; }
    .score-num { font-size:15px; }
    .root-meta { flex-basis:100%; order:6; font-size:12px; }
    .tags { order:7; }
    th, td { padding:8px 6px; }
    th:first-child, td:first-child { padding-left:12px; }
    th:last-child, td:last-child { padding-right:12px; }
    td.lemma-ar { font-size:18px; }
    tr.frag-row > td { padding:4px 8px 12px; }
    .frag { padding:8px 10px; }
    .frag-words .wa { font-size:19px; }
  }
</style>
</head>
<body>
<header>
  <h1>Quran Meaning Groups</h1>
  <div class="controls">
    <input id="q" type="search" placeholder="Search root, meaning group, or lemma…" autocomplete="off">
    <select id="sort">
      <option value="score">Sort: relevance</option>
      <option value="words">Sort: # words</option>
      <option value="root">Sort: root (A→Z)</option>
    </select>
    <span class="stats" id="stats"></span>
  </div>
  <div class="tagbar hidden" id="tagbar"></div>
</header>
<main id="list"></main>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const list = document.getElementById('list');
const q = document.getElementById('q');
const sortSel = document.getElementById('sort');
const stats = document.getElementById('stats');

const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Arabic verb forms I-XII, indexed by lemma_forms.json's numeric form.
const ROMAN = [,'I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function hl(s, term){
  s = esc(s);
  if(!term) return s;
  const i = s.toLowerCase().indexOf(term);
  if(i<0) return s;
  return s.slice(0,i)+'<mark>'+s.slice(i,i+term.length)+'</mark>'+s.slice(i+term.length);
}

function render(){
  const term = q.value.trim().toLowerCase();
  const sort = sortSel.value;
  let items = DATA.filter(r => passesTagFilter(r.root)).map(r => {
    const hit = !term || r.root.toLowerCase().includes(term) ||
      r.groups.some(gk => gk.toLowerCase().includes(term)) ||
      r.label.toLowerCase().includes(term) ||
      (r.desc||'').toLowerCase().includes(term);
    const lemmas = hit ? r.lemmas : r.lemmas.filter(l =>
      l.lemma.toLowerCase().includes(term));
    return (hit || lemmas.length) ? {r, lemmas} : null;
  }).filter(Boolean);

  items.sort((a,b) =>
    sort==='root' ? (a.r.root.localeCompare(b.r.root) ||
                     b.r.word_count-a.r.word_count) :
    sort==='words' ? b.r.word_count-a.r.word_count :
    b.r.score-a.r.score);

  stats.textContent = new Set(items.map(x=>x.r.root)).size+' roots · '+
    items.length+' meaning groups';

  const lemmaRow = (l, term, root, label) => `
      <tr class="lemma-row" data-lemma="${esc(l.lemma)}" data-root="${esc(root)}"
          data-meaning="${esc(label)}" onclick="toggleFragments(this)"
          title="Click to show this meaning's fragments">
        <td class="lemma-ar ar">${hl(l.lemma,term)}</td>
        <td class="score">${l.score.toLocaleString()}</td>
        <td class="num"${l.count===l.total ? '' :
          ` title="${l.total.toLocaleString()} occurrences across all meanings"`}>${
          l.count.toLocaleString()}${l.count===l.total ? '' :
          `<span class="m-cnt">/${l.total.toLocaleString()}</span>`}</td>
        <td><span class="pos ${l.pos}">${l.pos}</span>${
          l.form ? `<span class="vf" title="Verb form ${l.form}">${ROMAN[l.form]}</span>` : ''}</td>
      </tr>`;

  list.innerHTML = items.map(({r,lemmas}) => {
    const open = term ? ' open' : '';
    const rows = lemmas.map(l => lemmaRow(l, term, r.root, r.label)).join('');
    return `
    <div class="root${open}">
      <div class="root-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="caret">▶</span>
        <span class="root-ar ar">${hl(r.root,term)}</span>
        <span class="root-meta"><span class="meaning-label">${hl(r.label,term)}</span>${r.desc ? `
          <span class="meaning-desc">${hl(r.desc,term)}</span>` : ''}</span>
        <span class="tags" data-root="${esc(r.root)}">${renderTags(r.root)}</span>
        <span class="root-score"><span class="score-num">${r.word_count.toLocaleString()}</span>
          <span class="score-lbl">word${r.word_count===1?'':'s'}</span></span>
      </div>
      <div class="lemmas"><table>
        <thead><tr><th>Lemma</th><th style="text-align:right">Score</th>
          <th style="text-align:right">Occurs</th><th>POS</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');
}

// ---- tags ----
let TAGS = {};            // root -> [tag, ...]
let VOCAB = [];           // all known tag names
let tagsAvailable = false;
let tagFilter = null;     // null | {mode:'only'|'hide', tag} | {mode:'untagged'}
let confirmDelete = null; // tag name pending delete confirmation

async function loadTags(){
  try {
    const res = await fetch('/api/tags');
    if(!res.ok) return;
    const data = await res.json();
    TAGS = data.tags; VOCAB = data.vocabulary || [];
    tagsAvailable = true;
    renderTagBar();
    render();
  } catch(e) { /* static serving: tagging UI stays hidden */ }
}

function tagCount(tag){
  return Object.values(TAGS).filter(ts => ts.includes(tag)).length;
}

function renderTagBar(){
  const bar = document.getElementById('tagbar');
  if(!tagsAvailable){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const untaggedCnt = new Set(
    DATA.filter(r => !(TAGS[r.root]||[]).length).map(r => r.root)).size;
  const st = t => !tagFilter ? '' : tagFilter.mode==='untagged'
      ? (t==='__untagged__' ? 'only' : '')
      : (tagFilter.tag===t ? tagFilter.mode : '');
  const modeIcon = m => m==='only' ? '<span class="mode">✓</span>' :
                        m==='hide' ? '<span class="mode">✗</span>' : '';
  let html = '<span class="lbl">Tags</span>';
  html += `<span class="fchip ${st('__untagged__')}" onclick="cycleFilter('__untagged__')">
     ${modeIcon(st('__untagged__'))}untagged <span class="cnt">${untaggedCnt}</span></span>`;
  for(const t of VOCAB){
    if(confirmDelete === t){
      html += `<span class="fchip confirm" onclick="deleteTagEverywhere('${esc(t)}')"
        title="Click to permanently remove this tag from all roots">
        delete “${esc(t)}” from ${tagCount(t)} roots? <span class="fchip-x"
        onclick="cancelDelete(event)">cancel</span></span>`;
    } else {
      const s = st(t);
      html += `<span class="fchip ${s}" onclick="cycleFilter('${esc(t)}')"
        title="Click: show only → hide → off">
        ${modeIcon(s)}${esc(t)} <span class="cnt">${tagCount(t)}</span>
        <span class="fchip-x" title="Delete tag everywhere"
          onclick="askDelete(event,'${esc(t)}')">×</span></span>`;
    }
  }
  html += `<button class="tag-add" onclick="newTagStart(this)">＋ new tag</button>`;
  bar.innerHTML = html;
}

function cycleFilter(t){
  confirmDelete = null;
  if(t === '__untagged__'){
    tagFilter = (tagFilter && tagFilter.mode==='untagged') ? null : {mode:'untagged'};
  } else if(!tagFilter || tagFilter.tag !== t){
    tagFilter = {mode:'only', tag:t};
  } else if(tagFilter.mode === 'only'){
    tagFilter = {mode:'hide', tag:t};
  } else {
    tagFilter = null;
  }
  renderTagBar();
  render();
}

function passesTagFilter(root){
  if(!tagFilter) return true;
  const tags = TAGS[root]||[];
  if(tagFilter.mode==='untagged') return tags.length===0;
  return tagFilter.mode==='only' ? tags.includes(tagFilter.tag)
                                 : !tags.includes(tagFilter.tag);
}

function askDelete(ev, tag){
  ev.stopPropagation();
  confirmDelete = tag;
  renderTagBar();
}

function cancelDelete(ev){
  ev.stopPropagation();
  confirmDelete = null;
  renderTagBar();
}

async function deleteTagEverywhere(tag){
  confirmDelete = null;
  const res = await fetch('/api/vocab?tag='+encodeURIComponent(tag), {method:'DELETE'});
  VOCAB = (await res.json()).vocabulary;
  for(const r of Object.keys(TAGS)){
    TAGS[r] = TAGS[r].filter(t => t!==tag);
    if(!TAGS[r].length) delete TAGS[r];
  }
  if(tagFilter && tagFilter.tag===tag) tagFilter = null;
  renderTagBar();
  render();
}

function newTagStart(btn){
  const input = document.createElement('input');
  input.className = 'tag-input';
  input.placeholder = 'new tag…';
  input.onkeydown = async e => {
    if(e.key === 'Escape'){ renderTagBar(); return; }
    if(e.key !== 'Enter') return;
    const tag = input.value.trim().toLowerCase();
    if(!tag){ renderTagBar(); return; }
    const res = await fetch('/api/vocab', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({tag})});
    VOCAB = (await res.json()).vocabulary;
    renderTagBar();
    render();
  };
  input.onblur = () => renderTagBar();
  btn.replaceWith(input);
  input.focus();
}

// ---- per-root tag chips ----
function renderTags(root){
  if(!tagsAvailable) return '';
  const chips = (TAGS[root]||[]).map(t =>
    `<span class="tag">${esc(t)}<span class="tag-x" title="Remove tag"
       onclick="removeTag(event,'${esc(root)}','${esc(t)}')">×</span></span>`).join('');
  return chips + `<button class="tag-add" onclick="addTagStart(event,this)">+ tag</button>`;
}

async function removeTag(ev, root, tag){
  ev.stopPropagation();
  await fetch('/api/tags?root='+encodeURIComponent(root)+'&tag='+encodeURIComponent(tag),
              {method:'DELETE'});
  TAGS[root] = (TAGS[root]||[]).filter(t => t!==tag);
  if(!TAGS[root].length) delete TAGS[root];
  renderTagBar();
  render();
}

async function addTagTo(root, tag){
  await fetch('/api/tags', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({root, tag})});
  (TAGS[root] = TAGS[root]||[]).includes(tag) || TAGS[root].push(tag);
  VOCAB.includes(tag) || VOCAB.push(tag) && VOCAB.sort();
  renderTagBar();
  render();
}

function addTagStart(ev, btn){
  ev.stopPropagation();
  const box = btn.parentNode;
  const root = box.dataset.root;
  const menu = document.createElement('span');
  menu.className = 'tag-menu';
  menu.onclick = e => e.stopPropagation();
  // Existing tags not yet on this root, as one-click picks.
  const picks = VOCAB.filter(t => !(TAGS[root]||[]).includes(t));
  for(const t of picks){
    const b = document.createElement('button');
    b.className = 'tag-pick';
    b.textContent = t;
    b.onclick = e => { e.stopPropagation(); addTagTo(root, t); };
    menu.appendChild(b);
  }
  const input = document.createElement('input');
  input.className = 'tag-input';
  input.placeholder = picks.length ? 'or new tag…' : 'new tag…';
  input.onclick = e => e.stopPropagation();
  input.onkeydown = e => {
    if(e.key === 'Escape'){ render(); return; }
    if(e.key !== 'Enter') return;
    const tag = input.value.trim().toLowerCase();
    if(!tag){ render(); return; }
    addTagTo(root, tag);
  };
  menu.appendChild(input);
  btn.replaceWith(menu);
  input.focus();
}

// ---- fragments ----
const fragCache = new Map();

// Static fallback: when serve.py's API is absent (GitHub Pages), query
// quran_lingo.db directly in the browser via sql.js-httpvfs. The assets
// (sqljs/ and the db) live next to docs/index.html; loading them lazily
// keeps the serve.py-backed copy of the page free of 404s.
let dbPromise = null;
function getDb(){
  if(!dbPromise){
    dbPromise = new Promise((resolve, reject) => {
      if(window.createDbWorker) return resolve();
      const s = document.createElement('script');
      s.src = 'sqljs/index.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('sqljs assets not found'));
      document.head.appendChild(s);
    }).then(() => createDbWorker(
      [{from: 'inline', config: {
        serverMode: 'full',
        url: new URL('quran_lingo.db', location.href).toString(),
        requestChunkSize: 4096,  // must match the db's PRAGMA page_size
        fileLength: 27779072,  // GitHub Pages omits Content-Length on HEAD
      }}],
      new URL('sqljs/sqlite.worker.js', location.href).toString(),
      new URL('sqljs/sql-wasm.wasm', location.href).toString()
    )).then(w => w.db);
  }
  return dbPromise;
}

// Mirrors serve.py's fragments_for_lemma().
async function fragmentsStatic(lemma, root, meaning){
  const db = await getDb();
  let keyset = null;
  if(root && meaning){
    const r = await db.query(
      'SELECT word_keys FROM meaning_groups WHERE root = ? AND meaning = ?',
      [root, meaning]);
    if(r.length) keyset = new Set(JSON.parse(r[0].word_keys));
  }
  const rows = await db.query(
    `SELECT fw.fragment_id fid, fw.word_index wi, s.surah, s.ayah, s.word
     FROM segments s
     JOIN fragment_words fw
       ON fw.surah = s.surah AND fw.ayah = s.ayah AND fw.word = s.word
     WHERE s.lemma = ?`, [lemma]);
  const hits = new Map();
  for(const r of rows){
    if(keyset && !keyset.has(r.surah+':'+r.ayah+':'+r.word)) continue;
    if(!hits.has(r.fid)) hits.set(r.fid, new Set());
    hits.get(r.fid).add(r.wi);
  }
  if(!hits.size) return [];
  const hitFids = [...hits.keys()];
  let ph = hitFids.map(() => '?').join(',');
  // Combined-context spans for hit words whose fragment is too short.
  const needRows = await db.query(
    `SELECT surah, ayah, word, combine_start cs, combine_end ce
     FROM word_context_needs WHERE fragment_id IN (${ph})`, hitFids);
  const needs = new Map(needRows.map(r => [r.surah+':'+r.ayah+':'+r.word, r]));
  const spans = new Map();  // hit fid -> widest [lo, hi] its hit words ask for
  for(const r of rows){
    if(!hits.get(r.fid)?.has(r.wi)) continue;
    const n = needs.get(r.surah+':'+r.ayah+':'+r.word);
    if(!n) continue;
    const cur = spans.get(r.fid) || [n.cs, n.ce];
    spans.set(r.fid, [Math.min(cur[0], n.cs), Math.max(cur[1], n.ce)]);
  }
  const frags = await db.query(
    `SELECT fragment_id fid, surah, ayah, position, english FROM fragments
     WHERE fragment_id IN (${ph}) ORDER BY surah, ayah, position`, hitFids);
  const fragInfo = new Map(frags.map(f => [f.fid, f]));
  // Pull in the neighbor fragments of every combined span.
  const byPos = new Map();  // "s:a" -> Map(position -> {fid, english})
  for(const fid of spans.keys()){
    const f = fragInfo.get(fid), ak = f.surah+':'+f.ayah;
    if(byPos.has(ak)) continue;
    const nbrs = await db.query(
      `SELECT fragment_id fid, position, english FROM fragments
       WHERE surah = ? AND ayah = ?`, [f.surah, f.ayah]);
    byPos.set(ak, new Map(nbrs.map(n => [n.position, n])));
  }
  const allFids = new Set(hitFids);
  for(const [fid, [lo, hi]] of spans){
    const f = fragInfo.get(fid), m = byPos.get(f.surah+':'+f.ayah);
    for(let p = lo; p <= hi; p++) allFids.add(m.get(p).fid);
  }
  const fids = [...allFids];
  ph = fids.map(() => '?').join(',');
  const words = await db.query(
    `SELECT fragment_id fid, word_index wi, arabic FROM fragment_words
     WHERE fragment_id IN (${ph}) ORDER BY fragment_id, word_index`, fids);
  const segs = await db.query(
    `SELECT fw.fragment_id fid, fw.word_index wi, s.english en
     FROM fragment_words fw
     JOIN segments s
       ON s.surah = fw.surah AND s.ayah = fw.ayah AND s.word = fw.word
     WHERE fw.fragment_id IN (${ph})
     ORDER BY fw.fragment_id, fw.word_index, s.segment`, fids);
  const byFrag = new Map();
  for(const w of words){
    if(!byFrag.has(w.fid)) byFrag.set(w.fid, []);
    byFrag.get(w.fid).push(w.arabic);
  }
  const glossParts = new Map();
  for(const s of segs){
    if(!s.en) continue;
    const k = s.fid+'\u0001'+s.wi;
    if(!glossParts.has(k)) glossParts.set(k, []);
    const parts = glossParts.get(k);
    if(!parts.includes(s.en)) parts.push(s.en);  // segments often repeat the word gloss
  }
  // One display unit per (ayah, span); a plain fragment is the span
  // [position, position]. Hit fragments expanding to the same span merge.
  const units = new Map();
  for(const f of frags){
    const [lo, hi] = spans.get(f.fid) || [f.position, f.position];
    const key = f.surah+':'+f.ayah+':'+lo+':'+hi;
    if(!units.has(key)) units.set(key, {f, lo, hi, hl: []});
    for(const wi of hits.get(f.fid)) units.get(key).hl.push([f.fid, wi]);
  }
  return [...units.values()]
    .sort((a,b) => a.f.surah-b.f.surah || a.f.ayah-b.f.ayah || a.lo-b.lo)
    .map(({f, lo, hi, hl}) => {
      const members = hi > lo
        ? Array.from({length: hi-lo+1}, (_, i) =>
            byPos.get(f.surah+':'+f.ayah).get(lo+i))
        : [{fid: f.fid, english: f.english}];
      const ws = [], gs = [], ens = [], offsets = new Map();
      for(const m of members){
        offsets.set(m.fid, ws.length);
        const mw = byFrag.get(m.fid) || [];
        mw.forEach((w, wi) => {
          ws.push(w);
          gs.push((glossParts.get(m.fid+'\u0001'+wi) || []).join(' '));
        });
        if(m.english) ens.push(m.english);
      }
      const unit = {
        surah: f.surah, ayah: f.ayah, position: lo,
        english: ens.join(' ') || null, words: ws, glosses: gs,
        highlights: hl.map(([fid, wi]) => offsets.get(fid)+wi).sort((a,b) => a-b),
      };
      if(hi > lo) unit.combined = [lo, hi];
      return unit;
    });
}

async function fetchFragments(lemma, root, meaning){
  try {
    const res = await fetch('/api/fragments?lemma='+encodeURIComponent(lemma)
      +'&root='+encodeURIComponent(root)+'&meaning='+encodeURIComponent(meaning));
    if(!res.ok) throw new Error(res.status);
    return (await res.json()).fragments;
  } catch(e) {
    return fragmentsStatic(lemma, root, meaning);
  }
}

function renderFragments(list){
  if(!list.length) return '<div class="frag-status">No fragments found.</div>';
  return list.map(f => {
    const hi = new Set(f.highlights);
    const words = f.words.map((w,i) => `
      <span class="w${hi.has(i) ? ' hit' : ''}">
        <span class="wa ar">${esc(w)}</span>
        <span class="we">${esc((f.glosses||[])[i]||'')}</span>
      </span>`).join('');
    return `<div class="frag">
      <span class="frag-loc">${f.surah}:${f.ayah}${f.combined
        ? '<span class="frag-combined" title="This word\u2019s own fragment is too short to learn from; neighboring fragments are shown for context">+ context</span>'
        : ''}</span>
      <div class="frag-words">${words}</div>
      <div class="frag-en">${esc(f.english||'')}</div>
    </div>`;
  }).join('');
}

async function toggleFragments(row){
  const next = row.nextElementSibling;
  if(next && next.classList.contains('frag-row')){ next.remove(); return; }
  const lemma = row.dataset.lemma, root = row.dataset.root, meaning = row.dataset.meaning;
  const key = lemma+'|'+root+'|'+meaning;
  const detail = document.createElement('tr');
  detail.className = 'frag-row';
  detail.innerHTML = '<td colspan="4"><div class="frag-status">Loading fragments…</div></td>';
  row.after(detail);
  try {
    if(!fragCache.has(key)){
      fragCache.set(key, await fetchFragments(lemma, root, meaning));
    }
    detail.firstElementChild.innerHTML = renderFragments(fragCache.get(key));
  } catch(e) {
    fragCache.delete(key);
    detail.firstElementChild.innerHTML =
      '<div class="frag-status">Could not load fragments — needs serve.py or the docs/ static assets. ('+esc(String(e))+')</div>';
  }
}

sortSel.addEventListener('change', render);

loadTags();
